<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111110">
<meta name="description" content="起势 GROWTH — 抖音流量承接型知识课程平台。从账号定位、内容生产、AI 提效到抖音获客，系统掌握完整增长方法。">
<title>起势 GROWTH — 让短视频真正带来客户</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>

<!-- ============ Header ============ -->
<header class="hdr" id="hdr">
  <div class="hdr-in">
    <a class="logo" href="#/" aria-label="起势 首页">
      <b>起势</b><i></i><small>Growth&nbsp;Studio</small>
    </a>
    <nav class="hdr-nav" id="hdrNav" aria-label="主导航">
      <a href="#/" data-nav="/" >首页</a>
      <a href="#/courses" data-nav="/courses">全部课程</a>
      <a href="#/genshi" data-nav="/genshi" data-goto="home#teachers">导师</a>
      <a href="#/anli" data-nav="/anli" data-goto="home#cases">学员案例</a>
    </nav>
    <div class="hdr-right">
      <button class="icon-btn" id="btnSearch" aria-label="搜索课程"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20.5 20.5L16 16"/></svg></button>
      <button class="btn btn-accent btn-sm btn-cta" id="btnCta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.8-3.4 3.6-5.2 7-5.2s6.2 1.8 7 5.2"/></svg>登录</button>
      <button class="icon-btn btn-menu" id="btnMenu" aria-label="打开菜单"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    </div>
  </div>
</header>

<!-- ============ 抽屉导航 ============ -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="导航抽屉">
  <div class="drawer-head">
    <span class="logo"><b>起势</b><i></i></span>
    <button class="icon-btn drawer-close" id="drawerClose" aria-label="关闭菜单"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <nav class="drawer-nav" id="drawerNav">
    <a href="#/" data-nav="/">首页<span>HOME</span></a>
    <a href="#/courses" data-nav="/courses">全部课程<span>COURSES</span></a>
    <a href="#/mine" data-nav="/mine">我的学习<span>MY&nbsp;LEARN</span></a>
    <a href="#/genshi" data-goto="home#teachers">实战导师<span>MENTORS</span></a>
    <a href="#/anli" data-goto="home#cases">学员案例<span>CASES</span></a>
    <a href="#/helps" data-nav="/helps">帮助中心<span>HELP</span></a>
    <a href="#/courses?cat=all" data-nav="/courses">四大课程体系<span>CATALOG</span></a>
  </nav>
  <div class="drawer-foot" id="drawerFoot"></div>
</aside>

<!-- ============ 视图容器 ============ -->
<main id="main">
  <div id="view-root" class="page"></div>
</main>

<!-- ============ 移动端底部固定 CTA ============ -->
<div class="stkbar" id="stkbar">
  <div class="sb-price">
    <b id="sbPrice">¥199</b><span class="was" id="sbWas">¥399</span>
    <small id="sbTip">限时优惠中</small>
  </div>
  <button class="btn btn-accent btn-block" id="sbBuy" style="max-width:220px">立即购买</button>
</div>

<!-- ============ 搜索浮层 ============ -->
<div class="searchov" id="searchov" role="dialog" aria-label="搜索课程">
  <div class="sov-head">
    <input class="input" id="sovInput" type="text" placeholder="搜索课程、老师、关键词…" autocomplete="off">
    <button class="icon-btn" id="sovClose" aria-label="关闭搜索" style="color:var(--ink)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="sov-body" id="sovBody"></div>
</div>

<!-- ============ Modal / Toast / Debug ============ -->
<div class="modal-scrim" id="modalScrim"><div class="modal" id="modalBox" role="dialog" aria-modal="true"></div></div>
<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

<button class="dbg-handle" id="dbgHandle" aria-label="打开 Debug 调试面板" data-tip="Prototype Debug · 点击打开（快捷键 D）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M12 2.8l1 2.3 2.5-.5.7 2.4 2.4.7-.5 2.5 2.3 1-2.3 1 .5 2.5-2.4.7-.7 2.4-2.5-.5-1 2.3-1-2.3-2.5.5-.7-2.4-2.4-.7.5-2.5-2.3-1 2.3-1-.5-2.5 2.4-.7.7-2.4 2.5.5z"/></svg></button>
<aside class="dbg" id="dbg" aria-label="Debug 调试面板">
  <div class="dbg-head">
    <b>Prototype Debug</b><span class="chip-mini">隐藏面板</span>
    <button class="dbg-close" id="dbgClose" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="dbg-body" id="dbgBody"></div>
</aside>

<noscript><p style="padding:60px 20px;text-align:center">本原型需要启用 JavaScript 运行。</p></noscript>

<script src="js/app.js"></script>
</body>
</html>
