<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111110">
<meta name="description" content="起势 GROWTH — 抖音流量承接型知识课程平台。从账号定位、内容生产、AI 提效到抖音获客，系统掌握完整增长方法。">
<title>起势 GROWTH — 让短视频真正带来客户</title>
<style>
/* ============================================================
   起势 GROWTH · Design Tokens
   ============================================================ */
:root{
  color-scheme:light dark;
  /* 色彩（light-dark() 双主题令牌） */
  --paper:light-dark(#F5F4EF,#16161a);      /* 米白纸感 / 暗纸 */
  --paper-2:light-dark(#ECEAE2,#1d1d22);
  --paper-3:light-dark(#E2DFD5,#2a2a31);
  --ink:#111110;              /* 近黑（两主题一致的深色结构色） */
  --ink-2:#1B1B19;
  --ink-3:#262624;
  --accent:#C9F04B;           /* 酸性柠绿 */
  --accent-soft:light-dark(rgba(201,240,75,.16),rgba(201,240,75,.14));
  --t1:light-dark(#191917,#ececea);
  --t2:light-dark(#5B5A53,#b6b5af);
  --t3:light-dark(#96948A,#868581);
  --line:light-dark(rgba(17,17,16,.13),rgba(245,244,239,.13));
  --line-2:light-dark(rgba(17,17,16,.26),rgba(245,244,239,.28));
  --line-dark:rgba(245,244,239,.14);
  --line-dark-2:rgba(245,244,239,.32);
  --ok:#1F7A4D;
  --err:#C03A2D;
  --warn:#A86A00;
  --on-ink:#F5F4EF;
  --card:light-dark(#fff,#202024);
  --card-2:light-dark(#FCFCFA,#27272c);

  /* 字形 */
  --f-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Segoe UI",sans-serif;
  --f-serif:Georgia,"Times New Roman","Songti SC","STSong","SimSun",serif;

  /* 圆角 / 阴影 */
  --r-s:4px; --r:8px; --r-l:14px;
  --sh-sm:light-dark(0 1px 2px rgba(17,17,16,.06),0 1px 2px rgba(0,0,0,.45));
  --sh-md:light-dark(0 2px 6px rgba(17,17,16,.05),0 2px 6px rgba(0,0,0,.4));

  /* 尺寸 */
  --cw:min(1140px,100% - clamp(32px,8vw,96px)); /* 内容容器 */
  --cw-l:min(1280px,100% - clamp(32px,8vw,96px));
  --hdr-h:60px;
  --gutter:clamp(16px,4vw,40px);
  --t: clamp(.32s,.6s,0s); /* 动画时长基准 */
}
@media (max-width:520px){ :root{ --cw:calc(100% - 2*16px); } }

/* ============================================================
   Reset
   ============================================================ */
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; overflow-x:hidden; color-scheme:light dark; }
body{
  font-family:var(--f-sans); color:var(--t1); background:var(--paper);
  line-height:1.6; font-size:15px; -webkit-font-smoothing:antialiased;
  overflow-x:hidden; min-height:100vh;
}
img,svg,video{ display:block; max-width:100%; }
button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
input,select,textarea{ font:inherit; }
a{ color:inherit; text-decoration:none; }
ul,ol{ list-style:none; }
h1,h2,h3,h4{ line-height:1.22; font-weight:800; letter-spacing:-.01em; text-wrap:balance; }
::selection{ background:var(--accent); color:var(--ink); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
[hidden]{ display:none !important; }

/* 跳过链接 */
.skip{ position:fixed; left:-999px; top:8px; z-index:200; background:var(--accent); color:var(--ink); padding:8px 16px; border-radius:var(--r-s); font-weight:700; }
.skip:focus{ left:8px; }

/* ============================================================
   Typography · 编辑排版语言
   ============================================================ */
.en{ font-family:var(--f-serif); font-style:italic; letter-spacing:0; }
.k{ display:inline-flex; align-items:center; gap:10px; font-size:11px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:var(--t2); }
.k::before{ content:""; width:26px; height:1px; background:var(--accent); }
.k.on-dark{ color:rgba(245,244,239,.62); }
.h1{ font-size:clamp(34px,6.6vw,64px); font-weight:800; letter-spacing:-.02em; line-height:1.14; }
.h2{ font-size:clamp(26px,4.4vw,42px); font-weight:800; letter-spacing:-.015em; line-height:1.18; }
.h3{ font-size:clamp(18px,2.4vw,22px); font-weight:800; letter-spacing:-.01em; }
.hl-word{ position:relative; white-space:nowrap; }
.hl-word::after{ content:""; position:absolute; left:-2px; right:-6px; bottom:.02em; height:.34em; background:var(--accent); opacity:.85; z-index:-1; border-radius:2px; }
.lead{ font-size:clamp(15px,2vw,18px); color:var(--t2); line-height:1.75; }
.lead.on-dark{ color:rgba(245,244,239,.72); }
.mono-num{ font-variant-numeric:tabular-nums; letter-spacing:0; }

/* ============================================================
   Layout 工具
   ============================================================ */
.wrap{ width:var(--cw); margin-inline:auto; }
.wrap-l{ width:var(--cw-l); margin-inline:auto; }
.sec{ padding-block:clamp(52px,9vw,110px); position:relative; }
.sec-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:18px; margin-bottom:clamp(26px,4.5vw,44px); }
.sec-head .btns{ display:flex; gap:10px; flex-shrink:0; }
.sec-title{ display:flex; flex-direction:column; gap:12px; }
.row{ display:flex; flex-wrap:wrap; }

/* ============================================================
   Button 系统
   ============================================================ */
.btn{
  position:relative; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font-weight:700; line-height:1; white-space:nowrap; user-select:none;
  padding:0 22px; height:48px; border-radius:var(--r-s);
  border:1px solid transparent;
  transition:transform .16s cubic-bezier(.2,.8,.3,1),background .18s ease,color .18s ease,border-color .18s ease,opacity .18s ease;
  -webkit-tap-highlight-color:transparent;
}
.btn:active{ transform:scale(.97); }
.btn:disabled, .btn.is-disabled{ opacity:.42; pointer-events:none; }
.btn .ic{ width:16px; height:16px; flex:none; }
.btn > svg{ width:16px; height:16px; flex:none; }
.btn-lg > svg{ width:18px; height:18px; }
.btn-sm > svg{ width:14px; height:14px; }
.btn-lg{ height:56px; padding:0 30px; font-size:17px; border-radius:6px; }
.btn-sm{ height:36px; padding:0 14px; font-size:13px; }
.btn-block{ width:100%; }
.btn-primary{ background:var(--ink); color:var(--on-ink); }
.btn-primary:hover{ background:var(--ink-3); }
.btn-accent{ background:var(--accent); color:var(--ink); }
.btn-accent:hover{ background:#d8f76f; }
.btn-ghost{ border-color:var(--line-2); color:var(--t1); background:transparent; }
.btn-ghost:hover{ border-color:var(--ink); }
.btn-ghost-dark{ border-color:var(--line-dark-2); color:var(--on-ink); background:transparent; }
.btn-ghost-dark:hover{ background:rgba(245,244,239,.08); }
.btn-danger{ background:var(--err); color:#fff; }
.btn.is-loading{ pointer-events:none; }
.btn.is-loading .btn-label{ visibility:hidden; }
.spinner{ position:absolute; inset:0; margin:auto; width:18px; height:18px; border-radius:50%;
  border:2px solid currentColor; border-top-color:transparent; animation:spin .7s linear infinite; }
.btn.is-loading .spinner{ display:block; }
.spinner{ display:none; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* 收藏按钮 */
.fav{
  width:46px; height:46px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--line-2); background:var(--card); color:var(--t2); transition:all .18s ease; flex:none;
}
.fav:hover{ border-color:var(--ink); color:var(--ink); }
.fav.is-on{ color:#fff; background:var(--err); border-color:var(--err); }
.fav > svg{ width:18px; height:18px; }
.fav.is-on svg path{ fill:currentColor; stroke:currentColor; }
.fav.on-dark{ border-color:var(--line-dark-2); background:transparent; color:rgba(245,244,239,.8); }
.fav.on-dark:hover{ border-color:var(--on-ink); }
.fav.on-dark.is-on{ background:var(--err); border-color:var(--err); color:#fff; }

/* ============================================================
   Input / Chips / 徽标
   ============================================================ */
.field{ display:flex; flex-direction:column; gap:8px; }
.field label{ font-size:13px; font-weight:700; color:var(--t2); }
.input{
  height:48px; padding:0 14px; border-radius:var(--r-s); border:1px solid var(--line-2);
  background:var(--card); color:var(--t1); transition:border-color .18s ease,box-shadow .18s ease; width:100%;
}
.input:focus{ outline:none; border-color:var(--ink); box-shadow:0 0 0 3px var(--accent-soft); }
.input::placeholder{ color:var(--t3); }
.chip{
  display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 14px; border-radius:999px;
  border:1px solid var(--line-2); background:var(--card); color:var(--t2); font-size:13px; font-weight:600;
  transition:all .16s ease; white-space:nowrap;
}
.chip:hover{ border-color:var(--ink); color:var(--ink); }
.chip.is-on{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.chip.on-dark{ background:transparent; border-color:var(--line-dark-2); color:rgba(245,244,239,.85); }
.chip.on-dark.is-on{ background:var(--accent); border-color:var(--accent); color:var(--ink); }
.tag{
  display:inline-flex; align-items:center; height:22px; padding:0 9px; border-radius:3px;
  background:var(--ink); color:var(--paper); font-size:11px; font-weight:700; letter-spacing:.04em;
}
.tag.accent{ background:var(--accent); color:var(--ink); }
.tag.soft{ background:rgba(25,25,23,.06); color:var(--t2); }
.tag.outline{ background:transparent; border:1px solid var(--line-2); color:var(--t2); }
.tag.on-dark{ background:rgba(245,244,239,.12); color:var(--on-ink); }
.tag.on-dark.accent{ background:var(--accent); color:var(--ink); }
.badge-dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); display:inline-block; }
.stars{ display:inline-flex; align-items:center; gap:2px; color:#E7A33C; }
.stars .star{ width:13px; height:13px; }
.stars .star-e{ opacity:.38; }
.stars .star-h{ position:relative; }
.stars .star-h .ov{ position:absolute; left:0; top:0; width:50%; height:100%; overflow:hidden; }
.stars small{ color:var(--t2); margin-left:4px; font-weight:700; }
/* 内联图标在文本/徽章中的统一尺寸 */
.tag svg{ width:12px; height:12px; vertical-align:-2px; }
h2 > svg, h3 > svg{ width:.9em; height:.9em; display:inline-block; vertical-align:-.1em; }
.state-box .sg svg{ width:32px; height:32px; }
.rev-foot button svg{ width:13px; height:13px; vertical-align:-2px; }
.bpromo svg{ width:15px; height:15px; vertical-align:-2px; }
.prow svg{ width:14px; height:14px; vertical-align:-2px; }
.dbg-handle svg{ width:16px; height:16px; vertical-align:middle; }
.modal-x svg, .dbg-close svg{ width:13px; height:13px; }
/* ============================================================
   Header · 全局导航（液态玻璃·深色变体）
   ============================================================ */
.hdr{ position:fixed; inset:0 0 auto 0; z-index:90; height:var(--hdr-h);
  background:linear-gradient(180deg, rgba(41,41,39,.52), rgba(23,23,22,.30));
  -webkit-backdrop-filter:blur(22px) saturate(180%); backdrop-filter:blur(22px) saturate(180%);
  border-bottom:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 8px 26px -18px rgba(0,0,0,.65);
  transition:background .25s ease,box-shadow .25s ease; }
.hdr.is-scrolled{ background:linear-gradient(180deg, rgba(35,35,33,.8), rgba(20,20,19,.66));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 6px 24px -12px rgba(0,0,0,.5); }
.hdr-in{ width:var(--cw-l); margin-inline:auto; height:100%; display:flex; align-items:center; gap:22px; }
.logo{ display:inline-flex; align-items:baseline; gap:7px; color:var(--on-ink); flex:none; }
.logo b{ font-size:20px; font-weight:800; letter-spacing:.02em; }
.logo i{ width:7px; height:7px; border-radius:50%; background:var(--accent); display:inline-block; }
.logo small{ font-size:10px; font-weight:700; letter-spacing:.28em; color:rgba(245,244,239,.55);
  font-family:var(--f-serif); font-style:italic; text-transform:uppercase; }
.hdr-nav{ display:flex; gap:4px; margin-inline:auto; }
.hdr-nav a{ position:relative; padding:8px 14px; font-size:14px; font-weight:600; color:rgba(245,244,239,.78); border-radius:6px; transition:color .16s ease,background .16s ease; }
.hdr-nav a:hover{ color:#fff; background:rgba(245,244,239,.08); }
.hdr-nav a.is-on{ color:var(--accent); }
.hdr-right{ display:flex; align-items:center; gap:10px; margin-left:auto; }
.icon-btn{ width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center;
  border-radius:8px; color:rgba(245,244,239,.85); transition:all .16s ease; }
.icon-btn svg{ width:19px; height:19px; }
.icon-btn:hover{ background:rgba(245,244,239,.1); color:#fff; }
.btn-menu{ display:none; }
@media (max-width:900px){
  .hdr-nav{ display:none; }
  .btn-menu{ display:inline-flex; }
  .hdr .btn-cta{ display:none; }
}

/* 抽屉导航 */
.scrim{ position:fixed; inset:0; background:rgba(10,10,9,.5); z-index:95; opacity:0; pointer-events:none; transition:opacity .25s ease; }
.scrim.show{ opacity:1; pointer-events:auto; }
.drawer{ position:fixed; top:0; right:0; bottom:0; width:min(320px,86vw); color:var(--on-ink);
  z-index:96; transform:translateX(102%); transition:transform .3s cubic-bezier(.2,.8,.3,1);
  display:flex; flex-direction:column;
  background:linear-gradient(200deg, rgba(52,52,49,.72), rgba(20,20,19,.58));
  -webkit-backdrop-filter:blur(26px) saturate(160%); backdrop-filter:blur(26px) saturate(160%);
  border-left:1px solid rgba(255,255,255,.16);
  box-shadow:inset 1px 0 0 rgba(255,255,255,.1), -24px 0 60px -24px rgba(0,0,0,.55); }
.drawer.show{ transform:translateX(0); }
.drawer-head{ display:flex; align-items:center; justify-content:space-between; padding:20px 22px; border-bottom:1px solid var(--line-dark); }
.drawer-close{ color:rgba(245,244,239,.8); }
.drawer-nav{ padding:10px 0; }
.drawer-nav a{ display:flex; align-items:center; justify-content:space-between; padding:15px 22px; font-size:16px; font-weight:700; color:var(--on-ink); border-bottom:1px solid rgba(245,244,239,.06); }
.drawer-nav a span{ color:var(--accent); font-size:11px; letter-spacing:.15em; }
.drawer-nav a.is-on{ color:var(--accent); }
.drawer-foot{ margin-top:auto; padding:20px 22px; border-top:1px solid var(--line-dark); display:flex; flex-direction:column; gap:12px; }
.drawer-foot .user-mini{ display:flex; align-items:center; gap:12px; color:rgba(245,244,239,.75); font-size:14px; }

/* ============================================================
   Hero 首屏
   ============================================================ */
.hero{ background:var(--ink); color:var(--on-ink); position:relative; overflow:hidden;
  padding:calc(var(--hdr-h) + clamp(26px,4vw,52px)) 0 clamp(38px,6vw,64px); }
.hero::before{ content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(rgba(245,244,239,.045) 1px, transparent 1px),
             linear-gradient(90deg, rgba(245,244,239,.045) 1px, transparent 1px);
  background-size:42px 42px, 42px 42px; }
.hero-in{ position:relative; display:grid; grid-template-columns:1.08fr .92fr; gap:clamp(28px,5vw,64px); align-items:center; }
.hero h1{ margin:18px 0 0; }
.hero .lead{ margin-top:18px; max-width:32em; }
.hero-actions{ display:flex; gap:12px; flex-wrap:wrap; margin-top:32px; }
.hero-auth-note{ margin-top:14px; font-size:12px; color:rgba(245,244,239,.5); }
.hero-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:40px; padding-top:28px; border-top:1px solid var(--line-dark); }
.hero-stat .n{ font-size:clamp(24px,3vw,34px); font-weight:800; letter-spacing:-.02em; }
.hero-stat .n em{ font-style:normal; color:var(--accent); }
.hero-stat .l{ font-size:12px; color:rgba(245,244,239,.58); margin-top:2px; }
.hero-badge{ position:absolute; top:0; right:0; padding:6px 12px; font-family:var(--f-serif); font-style:italic;
  font-size:12px; color:var(--ink); background:var(--accent); border-bottom-left-radius:8px; }

/* 手机艺术卡片（iPhone 16 Pro 竖屏 · 149.6×71.5 · 等距边框 · 大圆角 · 无状态栏） */
.hero-art{ display:flex; justify-content:flex-end; position:relative; }
.phone{ width:min(312px,72vw); aspect-ratio:calc(71.5/149.6); background:linear-gradient(180deg,#2c2c2a,#121211);
  border:2px solid rgba(255,255,255,.3); border-radius:max(30px,min(312px,72vw)*0.18); padding:6px;
  box-shadow:0 44px 90px -36px rgba(0,0,0,.72), inset 0 1px 0 rgba(255,255,255,.18); position:relative; }
.phone::after{ content:""; position:absolute; inset:0; border-radius:inherit; box-shadow:inset 0 0 0 3px rgba(0,0,0,.5); pointer-events:none; }
.phone-side{ position:absolute; right:-3px; top:28%; width:3px; height:46px; border-radius:99px; background:rgba(255,255,255,.35); }
.phone-screen{ width:100%; height:100%; background:var(--paper); border-radius:max(24px,min(312px,72vw)*0.15);
  overflow:hidden; display:flex; flex-direction:column; }
.phone-card{ position:relative; display:flex; flex-direction:column; gap:10px; padding:15px 16px; flex:0 0 100%; min-width:0; min-height:0;
  background:var(--card); transition:transform .25s cubic-bezier(.2,.8,.3,1),box-shadow .25s ease; }
.phone-card:hover{ transform:translateY(-4px); box-shadow:0 18px 38px -18px rgba(17,17,16,.4); }
.slide-no{ position:absolute; top:12px; right:12px; z-index:9; width:26px; height:26px; border-radius:50%;
  background:var(--card); color:var(--t2); display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:800; line-height:1; box-shadow:none; }
.phone-card:hover .slide-no{ color:var(--ink); }
.phone-carousel{ flex:1; min-height:0; overflow:hidden; position:relative; cursor:grab; }
.phone-carousel:active{ cursor:grabbing; }
.phone-track{ display:flex; height:100%; transition:transform .55s cubic-bezier(.2,.8,.3,1); will-change:transform; }
.phone-dots{ display:flex; justify-content:center; gap:5px; align-items:center; padding:8px 14px 10px; flex:none; }
.phone-dot{ width:6px; height:6px; padding:0; border-radius:99px; background:var(--line-2); transition:all .3s cubic-bezier(.2,.8,.3,1); flex:none; }
.phone-dot:hover{ background:var(--t3); }
.phone-dot.on{ width:20px; background:var(--ink); }
/* 封面（杂志式上半区，弹性占用 → 无留白） */
.phone-cover{ flex:1.06; border-radius:14px; background:var(--ink); position:relative; overflow:hidden;
  display:flex; flex-direction:column; justify-content:space-between; align-items:flex-start; padding:16px; gap:8px; }
.phone-cover b{ color:var(--on-ink); font-size:clamp(18px,5.6vw,22px); font-weight:800; z-index:1; line-height:1.3;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.phone-cover .cov-cat{ z-index:1; }
.phone-cover .cov-tip{ color:rgba(245,244,239,.62); font-size:11px; z-index:1; display:inline-flex; align-items:center; gap:6px; }
.phone-cover .cov-tip svg{ width:12px; height:12px; color:var(--accent); }
.phone-cover::after{ content:""; position:absolute; right:-30px; top:-34px; width:130px; height:130px; border-radius:50%; border:18px solid var(--accent); opacity:.38; }
.phone-cover .cov-line{ position:absolute; left:-34px; bottom:-18px; width:150%; height:12px; background:var(--accent); opacity:.22; transform:rotate(-7deg); z-index:1; }
/* 信息区（干货要点，弹性填满） */
.phone-info{ flex:1; min-width:0; display:flex; flex-direction:column; justify-content:space-between; gap:9px; }
.phone-points{ display:flex; flex-direction:column; gap:8px; }
.phone-points li{ display:flex; align-items:flex-start; gap:9px; font-size:12.5px; color:var(--t1); line-height:1.5; }
.phone-points .pt-ic{ width:19px; height:19px; flex:none; border-radius:50%; background:var(--accent); color:var(--ink);
  display:flex; align-items:center; justify-content:center; margin-top:1px; }
.phone-points .pt-ic svg{ width:10px; height:10px; }
.phone-tags{ display:flex; gap:7px; flex-wrap:wrap; }
.ptag{ font-size:10.5px; color:var(--t2); border:1px solid var(--line-2); border-radius:99px; padding:2px 9px; background:var(--card); white-space:nowrap; }
.phone-concl{ font-size:11px; color:var(--t3); line-height:1.5; }
.phone-btm{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.phone-price .p{ font-weight:800; color:var(--ink); white-space:nowrap; font-size:21px; letter-spacing:-.02em; }
.phone-price .p small{ color:var(--err); font-size:11.5px; text-decoration:line-through; font-weight:600; margin-right:6px; }
.phone-acts{ display:flex; gap:7px; }
.phone-acts .pact{ display:inline-flex; align-items:center; gap:5px; height:34px; padding:0 13px; border-radius:7px;
  font-size:12px; font-weight:700; border:1px solid var(--line-2); background:var(--card); color:var(--ink); flex:none; white-space:nowrap; transition:all .16s ease; }
.phone-acts .pact svg{ width:12px; height:12px; }
.phone-acts .pact:hover{ border-color:var(--ink); }
.phone-acts .pact.on{ background:var(--accent); border-color:var(--accent); color:var(--ink); }
.phone-acts .pact.on:hover{ background:#d8f76f; }
/* 周边悬浮数据（半跨手机边框，图层置于手机上方，可轻微遮挡边框） */
.phone-chip{ position:absolute; z-index:12; background:var(--accent); color:var(--ink); font-weight:800; font-size:12.5px;
  padding:8px 13px; border-radius:999px; box-shadow:0 10px 24px -8px rgba(0,0,0,.4); animation:floaty 5s ease-in-out infinite; white-space:nowrap; }
.phone-chip small{ display:block; font-weight:600; font-size:10px; opacity:.7; letter-spacing:.04em; }
.phone-chip.a{ left:8px; top:-36px; }
.phone-chip.w{ background:var(--paper); color:var(--ink); right:8px; bottom:-44px; animation-delay:-2.5s; }
.phone-chip.swap{ animation:none; opacity:0; }
.phone-chip{ transition:opacity .28s ease; color:var(--ink); }
@keyframes floaty{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-6px);} }

/* ============================================================
   Marquee 走马灯
   ============================================================ */
.marq{ background:var(--ink-2); border-block:1px solid var(--line-dark); overflow:hidden; padding:14px 0; max-width:100vw;
  mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent); -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent); }
.marq-track{ display:flex; gap:44px; width:max-content; animation:marq 26s linear infinite; }
.marq span{ display:inline-flex; align-items:center; gap:44px; color:rgba(245,244,239,.66); font-size:13px; font-weight:600; letter-spacing:.08em; white-space:nowrap; }
.marq span i{ color:var(--accent); font-style:normal; }
@keyframes marq{ to{ transform:translateX(-50%); } }

/* ============================================================
   Section 通用（深色块等）
   ============================================================ */
.bg-ink{ background:var(--ink); color:var(--on-ink); }
.bg-ink ::selection{ background:var(--accent); color:var(--ink); }
/* 深色 section 内的白色卡片需显式重置文字色，避免继承纸白色 */
.bg-ink .tinfo, .bg-ink .trow, .bg-ink .tdata div, .bg-ink .tcase, .bg-ink .tinfo .tinfo-cta{ color:var(--t1); }
.bg-ink .tdata b, .bg-ink .tcase b{ color:var(--ink); }
.bg-ink .tdata span{ color:var(--t2); font-weight:600; }
.bg-ink .trow .tmeta b{ color:var(--ink); }
.bg-ink .trow .tgo{ color:var(--t1); }
.bg-paper2{ background:var(--paper-2); }
.hairline{ border-block:1px solid var(--line); }
/* ============================================================
   Course Card · 课程卡片（封面为 CSS 艺术排版）
   ============================================================ */
.clist{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,272px),1fr)); gap:18px; }
.clist.is-rail{ grid-auto-flow:column; grid-auto-columns:minmax(min(78vw,264px),1fr); overflow-x:auto; overflow-y:hidden;
  scroll-snap-type:x mandatory; padding-bottom:10px; -webkit-overflow-scrolling:touch; scrollbar-width:thin; }
.clist.is-rail > *{ scroll-snap-align:start; }
.ccard{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; position:relative;
  display:flex; flex-direction:column; transition:transform .22s cubic-bezier(.2,.8,.3,1),box-shadow .22s ease,border-color .22s ease; }
.ccard:hover{ transform:translateY(-4px); box-shadow:var(--sh-md); border-color:rgba(17,17,16,.24); }
.ccover{ aspect-ratio:16/9.3; position:relative; overflow:hidden; background:var(--ink); }
.ccover .cov-cat{ position:absolute; top:12px; left:12px; z-index:3; }
.ccover .cov-fav{ position:absolute; top:10px; right:10px; z-index:3; }
.ccover .cov-num{ position:absolute; left:14px; bottom:-8px; font-family:var(--f-serif); font-weight:700;
  font-size:58px; line-height:.9; color:rgba(245,244,239,.9); z-index:2; letter-spacing:-.03em; }
.ccover .cov-en{ position:absolute; right:12px; bottom:10px; font-family:var(--f-serif); font-style:italic;
  font-size:11px; color:rgba(245,244,239,.5); z-index:2; letter-spacing:.1em; }
.ccover .cov-art{ position:absolute; z-index:1; }
/* 封面图形变体 */
.ccover[data-art="ring"] .cov-art{ right:-26px; top:-26px; width:130px; height:130px; border-radius:50%; border:16px solid var(--accent); opacity:.9; }
.ccover[data-art="ring"] .cov-art::after{ content:""; position:absolute; inset:26px; border-radius:50%; border:4px solid rgba(245,244,239,.35); }
.ccover[data-art="band"] .cov-art{ left:-14px; top:34%; width:130%; height:14px; background:var(--accent); transform:rotate(-14deg); }
.ccover[data-art="band"] .cov-art::after{ content:""; position:absolute; top:22px; left:0; width:100%; height:3px; background:rgba(245,244,239,.3); }
.ccover[data-art="grid"] .cov-art{ inset:0; background:linear-gradient(rgba(245,244,239,.08) 1px,transparent 1px),
  linear-gradient(90deg,rgba(245,244,239,.08) 1px,transparent 1px); background-size:22px 22px; }
.ccover[data-art="grid"] .cond{ position:absolute; left:26px; bottom:26px; width:54px; height:54px; border-radius:50%; background:var(--accent); }
.ccover[data-art="mid"] .cov-art{ left:50%; top:50%; width:86px; height:86px; border-radius:50%; transform:translate(-50%,-56%); background:var(--accent); }
.ccover[data-art="mid"] .cov-art::after{ content:""; position:absolute; inset:18px; border-radius:50%; background:var(--ink); }
.ccover[data-art="cross"]::after{ content:"+"; position:absolute; right:18px; top:8px; font-size:72px; font-weight:200; color:rgba(245,244,239,.16); z-index:1; line-height:1; }
.ccover[data-art="stripe"]{ background:var(--accent); }
.ccover[data-art="stripe"] .cov-num{ color:var(--ink); }
.ccover[data-art="stripe"] .cov-art{ inset:0; background:repeating-linear-gradient(-34deg, transparent 0 12px, rgba(17,17,16,.9) 12px 13px); opacity:.5; }
/* 浅色封面变体 */
.ccover[data-tone="light"]{ background:var(--paper-2); }
.ccover[data-tone="light"] .cov-num{ color:var(--ink); }
.ccover[data-tone="light"] .cov-en{ color:var(--t3); }
.ccard-body{ display:flex; flex-direction:column; gap:10px; padding:15px 16px 16px; flex:1; }
.ccard-body h3{ font-size:16px; font-weight:800; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.7em; }
.ccard-value{ font-size:13px; color:var(--t2); display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
.ccard-meta{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; color:var(--t2); font-size:12px; }
.ccard-meta .stu, .ccard-meta .ls{ display:inline-flex; align-items:center; gap:4px; flex:none; white-space:nowrap; }
.ccard-meta svg{ width:14px; height:14px; opacity:.7; }
.ccard-foot{ display:flex; align-items:flex-end; justify-content:space-between; margin-top:auto; padding-top:6px; border-top:1px dashed var(--line-2); }
.price{ display:flex; align-items:baseline; gap:7px; }
.price .now{ font-size:20px; font-weight:800; color:var(--ink); letter-spacing:-.02em; }
.price .now::before{ content:"¥"; font-size:13px; }
.price .was{ font-size:12px; color:var(--t3); text-decoration:line-through; }
.price .was::before{ content:"¥"; font-size:10px; }
.price .off{ font-size:11px; font-weight:700; color:var(--err); border:1px solid rgba(192,58,45,.35); padding:1px 5px; border-radius:3px; }
.ccard-cta{ display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:700; color:var(--ink); }
.ccard-cta em{ font-style:normal; transition:transform .2s ease; display:inline-block; }
.ccard:hover .ccard-cta em{ transform:translateX(3px); }
.ccard .cbadge{ position:absolute; top:12px; left:12px; z-index:4; }
.ccover .cov-cat + .cov-fav{ }

/* 排位数字（热门榜） */
.rank-no{ font-family:var(--f-serif); font-style:italic; font-size:42px; line-height:1; color:var(--line-2); font-weight:700; margin-right:6px; }
.rank-no.top{ color:var(--accent); text-shadow:0 0 0 rgba(0,0,0,0); }

/* 骨架屏 */
.sk-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
.sk-cover{ aspect-ratio:16/9.3; background:linear-gradient(100deg,var(--paper-2) 40%,var(--paper-3) 50%,var(--paper-2) 60%); background-size:200% 100%; animation:skw 1.2s linear infinite; }
.sk-line{ height:12px; border-radius:4px; margin:14px 16px 0; background:linear-gradient(100deg,var(--paper-2) 40%,var(--paper-3) 50%,var(--paper-2) 60%); background-size:200% 100%; animation:skw 1.2s linear infinite; }
.sk-line.w60{ width:60%; } .sk-line.w40{ width:40%; margin-bottom:14px; }
@keyframes skw{ to{ background-position:-200% 0; } }

/* ============================================================
   分类卡片
   ============================================================ */
.cat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,238px),1fr)); gap:16px; }
.cat-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:22px 20px 20px; position:relative; overflow:hidden;
  display:flex; flex-direction:column; gap:8px; transition:transform .2s cubic-bezier(.2,.8,.3,1),box-shadow .2s ease,border-color .2s ease; }
.cat-card:hover{ transform:translateY(-3px); box-shadow:var(--sh-md); border-color:rgba(17,17,16,.22); }
.cat-card::after{ content:""; position:absolute; right:-26px; top:-26px; width:96px; height:96px; border-radius:50%; border:15px solid var(--paper-2); transition:all .25s ease; }
.cat-card:hover::after{ transform:scale(1.12); }
.cat-card .cc-no{ font-family:var(--f-serif); font-style:italic; font-size:13px; color:var(--t3); letter-spacing:.1em; }
.cat-card h3{ font-size:20px; }
.cat-card .cc-desc{ font-size:13.5px; color:var(--t2); line-height:1.6; }
.cat-card .cc-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.cat-card .cc-go{ margin-top:14px; display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; }
.cat-card .cc-go em{ font-style:normal; transition:transform .2s ease; }
.cat-card:hover .cc-go em{ transform:translateX(3px); }

/* ============================================================
   数字统计（信任数据）
   ============================================================ */
.metric-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); }
.metric{ background:var(--paper); padding:clamp(20px,3.4vw,32px) 14px; text-align:center; }
.metric .n{ font-size:clamp(28px,4.6vw,44px); font-weight:800; letter-spacing:-.03em; }
.metric .n em{ font-style:normal; color:var(--t3); font-size:.62em; }
.metric .l{ font-size:12.5px; color:var(--t2); margin-top:4px; }
.metric .l small{ display:block; font-size:10.5px; color:var(--t3); }

/* ============================================================
   老师模块
   ============================================================ */
.tfeat{ display:grid; grid-template-columns:.86fr 1.14fr; border:1px solid var(--line); background:var(--card); border-radius:var(--r-l); overflow:hidden; }
.tp{ position:relative; background:var(--ink); min-height:320px; display:flex; align-items:flex-end; padding:22px; overflow:hidden; }
.tp::before{ content:""; position:absolute; inset:0; background:linear-gradient(rgba(245,244,239,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(245,244,239,.06) 1px,transparent 1px); background-size:26px 26px; }
.tp .tp-name{ position:relative; z-index:2; font-size:34px; font-weight:800; color:var(--on-ink); line-height:1.05; }
.tp .tp-name small{ display:block; font-family:var(--f-serif); font-style:italic; font-weight:400; font-size:12px; color:var(--accent); letter-spacing:.2em; margin-bottom:8px; }
.tp .tp-init{ position:absolute; right:-8px; top:14px; font-family:var(--f-serif); font-weight:700; font-size:150px; color:rgba(245,244,239,.07); z-index:1; line-height:1; }
.tp .tp-ring{ position:absolute; left:-40px; bottom:-50px; width:170px; height:170px; border-radius:50%; border:20px solid var(--accent); opacity:.95; }
.tinfo{ padding:clamp(22px,4vw,38px); display:flex; flex-direction:column; gap:14px; }
.tinfo h3{ font-size:clamp(20px,2.6vw,26px); }
.tinfo .trole{ display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--t2); }
.tinfo .trole .dot9{ width:8px; height:8px; border-radius:50%; background:var(--accent); border:1px solid var(--line-2); }
.tinfo p{ font-size:14px; color:var(--t2); line-height:1.75; }
.tdata{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); margin-top:4px; }
.tdata div{ background:var(--paper); padding:12px 10px; }
.tdata b{ display:block; font-size:18px; font-weight:800; }
.tdata span{ font-size:11.5px; color:var(--t3); }
.tcases{ display:flex; flex-direction:column; gap:8px; }
.tcase{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; background:var(--paper-2); border-radius:var(--r-s); font-size:13px; }
.tcase b{ font-weight:700; }
.tcase span{ color:var(--t2); font-size:12px; flex:1; }
.tcase em{ font-style:normal; color:var(--ok); font-weight:800; }

.tgrid{ display:grid; gap:14px; margin-top:16px; }
.trow{ display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:16px; align-items:center; border:1px solid var(--line); background:var(--card); border-radius:var(--r); padding:16px; transition:border-color .2s ease; }
.trow:hover{ border-color:var(--ink); }
.ava{ position:relative; width:64px; height:64px; border-radius:50%; background:var(--ink); color:var(--on-ink);
  display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; flex:none; }
.ava .a-ring{ position:absolute; inset:-3px; border-radius:50%; border:1px solid var(--line-2); }
.ava[data-c="1"]{ background:#262624; } .ava[data-c="1"]::after{ content:""; position:absolute; right:-2px; top:-2px; width:16px; height:16px; border-radius:50%; background:var(--accent); }
.ava[data-c="2"]{ background:var(--paper-2); color:var(--ink); } .ava[data-c="2"]::after{ content:""; position:absolute; left:-2px; top:-2px; width:16px; height:16px; border-radius:50%; background:var(--err); }
.ava[data-c="3"]{ background:#2E3323; color:var(--accent); } .ava[data-c="3"]::after{ content:""; position:absolute; right:-2px; bottom:-2px; width:16px; height:16px; border-radius:50%; background:var(--paper); border:1px solid var(--line-2); }
.ava[data-c="4"]{ background:var(--accent); color:var(--ink); } .ava[data-c="4"]::after{ content:""; position:absolute; left:-2px; bottom:-2px; width:16px; height:16px; border-radius:50%; background:var(--ink); }
.trow .tmeta b{ font-size:15.5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.trow .tmeta p{ font-size:12.5px; color:var(--t2); margin-top:2px; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
.trow .tgo{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; flex:none; }

/* ============================================================
   学员案例
   ============================================================ */
.case-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr)); gap:16px; }
.case-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px; display:flex; flex-direction:column; gap:14px; transition:border-color .2s ease,box-shadow .2s ease; }
.case-card:hover{ border-color:rgba(17,17,16,.22); box-shadow:var(--sh-md); }
.case-head{ display:flex; align-items:center; gap:12px; }
.case-head .ava{ width:42px; height:42px; font-size:15px; }
.case-head b{ font-size:14.5px; display:block; }
.case-head p{ font-size:12px; color:var(--t2); }
.case-head .mockbadge{ margin-left:auto; }
.case-result{ background:var(--accent-soft); border:1px solid rgba(201,240,75,.5); border-radius:var(--r-s); padding:10px 12px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.case-result b{ font-size:20px; font-weight:800; letter-spacing:-.02em; }
.case-result span{ font-size:12.5px; color:var(--t2); white-space:nowrap; }
.case-tl{ position:relative; padding-left:16px; display:flex; flex-direction:column; gap:10px; }
.case-tl::before{ content:""; position:absolute; left:3px; top:4px; bottom:4px; width:1px; background:var(--line-2); }
.case-tl li{ position:relative; font-size:12.5px; color:var(--t2); line-height:1.6; }
.case-tl li::before{ content:""; position:absolute; left:-16px; top:6px; width:7px; height:7px; border-radius:50%; background:var(--card); border:2px solid var(--t3); }
.case-tl li b{ color:var(--t1); font-weight:700; }
.case-foot{ margin-top:auto; display:flex; align-items:center; justify-content:space-between; padding-top:12px; border-top:1px dashed var(--line-2); font-size:12px; color:var(--t3); gap:10px; }
.case-foot > span{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.case-foot a{ color:var(--ink); font-weight:700; display:inline-flex; gap:4px; align-items:center; flex:none; white-space:nowrap; }
.case-foot a svg{ width:12px; height:12px; }
.mockbadge{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; color:var(--t3);
  border:1px dashed var(--line-2); border-radius:3px; padding:2px 7px; }
.mockbadge i{ width:5px; height:5px; border-radius:50%; background:var(--warn); }

/* ============================================================
   用户评价
   ============================================================ */
.rating-sum{ display:grid; grid-template-columns:auto 1fr; gap:26px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:22px 24px; }
.rating-sum .big{ text-align:center; }
.rating-sum .big b{ font-size:46px; font-weight:800; letter-spacing:-.03em; line-height:1; }
.rating-sum .big p{ font-size:12.5px; color:var(--t2); margin-top:6px; }
.rating-bars{ display:flex; flex-direction:column; gap:8px; }
.rbar{ display:grid; grid-template-columns:max-content 1fr 46px; align-items:center; gap:12px; font-size:12px; color:var(--t2); }
.rbar .pct{ font-size:13px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; text-align:left; }
.rbar b{ font-size:12px; color:var(--t3); font-weight:600; text-align:right; }
.rbar .track{ height:8px; background:var(--paper-3); border-radius:99px; overflow:hidden; }
.rbar .fill{ height:100%; background:var(--ink); border-radius:99px; }
.rbar .fill.hot{ background:var(--accent); }
.rbar.hot{ background:var(--accent-soft); border:1px solid rgba(201,240,75,.45); border-radius:10px; padding:6px 0; }
.rbar.hot .pct{ color:var(--ink); }
.rbar.hot b{ color:var(--t2); }
.rev-filter{ display:flex; gap:8px; flex-wrap:wrap; margin:18px 0 4px; }
.rev-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr)); gap:16px; }
.rev-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px; display:flex; flex-direction:column; gap:12px; }
.rev-head{ display:flex; align-items:center; gap:11px; }
.rev-head .ava{ width:40px; height:40px; font-size:14px; }
.rev-head b{ font-size:13.5px; display:flex; align-items:center; gap:6px; }
.rev-head .oktag{ font-size:10px; font-weight:700; color:var(--ok); border:1px solid rgba(31,122,77,.4); border-radius:3px; padding:1px 5px; }
.rev-head time{ margin-left:auto; font-size:11.5px; color:var(--t3); }
.rev-text{ font-size:13.5px; color:var(--t1); line-height:1.75; }
.rev-foot{ margin-top:auto; display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--t3); }
.rev-foot button{ display:inline-flex; align-items:center; gap:4px; color:var(--t2); font-size:12px; }
.rev-foot button:hover{ color:var(--ink); }

/* ============================================================
   核心价值 / 为什么选择我们 / 对比
   ============================================================ */
.val-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); }
.val-cell{ background:var(--paper); padding:clamp(20px,3vw,28px); display:flex; flex-direction:column; gap:8px; }
.val-cell .no{ font-family:var(--f-serif); font-style:italic; font-size:13px; color:var(--t3); }
.val-cell .no i{ font-style:normal; color:var(--accent); font-family:var(--f-serif); margin-right:4px; }
.val-cell h3{ font-size:16.5px; }
.val-cell p{ font-size:13px; color:var(--t2); line-height:1.65; }
.why-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:14px; }
.why-item{ display:flex; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px; }
.why-item .wi{ width:38px; height:38px; flex:none; border-radius:8px; background:var(--accent-soft); color:var(--ink); display:flex; align-items:center; justify-content:center; font-weight:800; }
.why-item b{ display:block; font-size:15px; margin-bottom:4px; }
.why-item p{ font-size:13px; color:var(--t2); line-height:1.65; }
.cmp{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
.cmp-row{ display:grid; grid-template-columns:1.1fr 1.4fr 1.4fr; align-items:center; }
.cmp-row + .cmp-row{ border-top:1px solid var(--line); }
.cmp-row > div{ padding:14px 16px; font-size:13px; color:var(--t2); }
.cmp-row > div:first-child{ font-weight:700; color:var(--t1); }
.cmp-row.head{ background:var(--ink); color:var(--on-ink); }
.cmp-row.head > div{ color:var(--on-ink); font-weight:800; padding:12px 16px; font-size:13.5px; }
.cmp-row .us{ background:var(--accent-soft); color:var(--ink); }
.cmp-row .no{ opacity:.55; }

/* ============================================================
   FAQ
   ============================================================ */
.faq{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
.faq-item + .faq-item{ border-top:1px solid var(--line); }
.faq-q{ width:100%; display:flex; align-items:center; gap:16px; padding:19px 20px; text-align:left; font-weight:700; font-size:15px; transition:background .16s ease; }
.faq-q:hover{ background:var(--paper-2); }
.faq-q .fx{ margin-left:auto; width:22px; height:22px; flex:none; position:relative; transition:transform .25s ease; }
.faq-q .fx::before,.faq-q .fx::after{ content:""; position:absolute; left:50%; top:50%; width:11px; height:1.6px; background:currentColor; transform:translate(-50%,-50%); }
.faq-q .fx::after{ transform:translate(-50%,-50%) rotate(90deg); }
.faq-item.open .fx{ transform:rotate(45deg); }
.faq-a{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .3s cubic-bezier(.2,.8,.3,1); }
.faq-item.open .faq-a{ grid-template-rows:1fr; }
.faq-a > div{ overflow:hidden; }
.faq-a p{ padding:0 20px 20px; font-size:13.5px; color:var(--t2); line-height:1.8; }

/* ============================================================
   最终 CTA / Footer
   ============================================================ */
.cta-final{ position:relative; background:var(--ink); color:var(--on-ink); border-radius:var(--r-l); overflow:hidden; padding:clamp(40px,7vw,72px) clamp(22px,5vw,64px); text-align:center; }
/* ============================================================
   转化增强组件
   ============================================================ */
/* 促销横条（列表/详情/订单顶部） */
.promo-bar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:linear-gradient(90deg, rgba(201,240,75,.2), rgba(201,240,75,.08));
  border:1px solid rgba(153,120,0,.35); border-radius:var(--r); padding:10px 14px; margin:16px 0 0; font-size:13px; color:var(--t1); }
.promo-bar svg{ width:15px; height:15px; color:var(--warn); flex:none; }
.promo-bar b{ color:#6b4d00; font-weight:800; }
.promo-bar .pb-go{ margin-left:auto; display:inline-flex; align-items:center; gap:5px; font-weight:700; color:var(--ink); white-space:nowrap; cursor:pointer; }
.promo-bar .pb-go:hover{ text-decoration:underline; }
/* 大纲探索 3 次后的试听提示条 */
.hint-bar{ position:fixed; left:50%; transform:translateX(-50%); z-index:75; bottom:calc(84px + env(safe-area-inset-bottom));
  display:flex; align-items:center; gap:12px; background:var(--ink); color:var(--paper); padding:10px 14px 10px 18px; border-radius:999px;
  box-shadow:0 18px 40px -14px rgba(0,0,0,.55); font-size:13px; opacity:0; pointer-events:none; transition:opacity .3s ease,transform .3s ease; transform:translate(-50%,14px); }
.hint-bar.show{ opacity:1; pointer-events:auto; transform:translate(-50%,0); }
.hint-bar button{ margin-left:6px; }
@media (max-width:640px){ .hint-bar{ width:auto; max-width:92vw; font-size:12px; } }
/* 续播提醒 */
.resume-chip{ position:absolute; left:12px; top:12px; z-index:6; display:none; align-items:center; gap:8px;
  background:var(--ink); color:var(--paper); padding:8px 14px; border-radius:999px; font-size:12px; box-shadow:var(--sh-md); cursor:pointer; }
.resume-chip.show{ display:inline-flex; }
.resume-chip svg{ width:13px; height:13px; color:var(--accent); }
/* 学完路径时间线 */
.path{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr)); gap:12px; }
.path-step{ position:relative; background:var(--card); border:1px solid var(--line); border-radius:var(--r-s); padding:16px; }
.path-step .pno{ font-family:var(--f-serif); font-style:italic; color:var(--t3); font-size:12px; }
.path-step .pno b{ color:var(--accent); font-family:var(--f-serif); font-style:italic; font-weight:700; }
.path-step h4{ font-size:14px; margin:6px 0 6px; }
.path-step p{ font-size:12px; color:var(--t2); line-height:1.6; }
/* 我的页收藏桥接提示 */
.mine-tip{ margin:0 0 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:var(--accent-soft);
  border:1px solid rgba(201,240,75,.5); border-radius:var(--r-s); padding:12px 14px; font-size:13px; }
.mine-tip b{ color:var(--ink); }
.mine-tip .btn{ margin-left:auto; }
/* 回执卡 */
.ticket-receipt{ margin-top:14px; border:1px dashed var(--ok); background:rgba(31,122,77,.07); border-radius:var(--r-s);
  padding:12px 14px; font-size:12.5px; color:var(--t2); line-height:1.7; }
.ticket-receipt b{ color:var(--ok); font-family:ui-monospace,Consolas,monospace; }
/* 案例行业筛选 */
.case-filter{ display:flex; gap:8px; flex-wrap:wrap; margin:0 0 16px; }
/* 成功页分享 */
.share-row{ display:flex; flex-direction:column; gap:8px; margin-top:18px; text-align:left; }
.share-row .tab{ display:inline-flex; align-items:center; gap:8px; }
.share-row .tab b{ font-size:13.5px; color:var(--t1); }
.share-row .tab span{ font-size:11px; color:var(--t3); }
.share-acts{ display:flex; gap:8px; flex-wrap:wrap; }
.share-act{ display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 14px; border:1px solid var(--line-2); border-radius:999px;
  background:var(--card); font-size:12.5px; font-weight:700; transition:all .16s ease; }
.share-act:hover{ border-color:var(--ink); }
.share-act svg{ width:15px; height:15px; }
.share-act.wx{ color:#07C160; } .share-act.qq{ color:#1677FF; }
/* Debug 漏斗 */
.dbg-funnel{ display:flex; gap:2px; height:26px; border-radius:6px; overflow:hidden; }
.dbg-funnel i{ display:block; height:100%; background:var(--accent); opacity:.9; min-width:2px; }
.dbg-funnel-row{ margin-bottom:4px; font-size:10.5px; color:rgba(245,244,239,.65); display:flex; justify-content:space-between; }
/* 路由过渡遮罩 */
.viewtrans{ position:fixed; inset:0; z-index:160; background:rgba(245,244,239,.5); opacity:0; pointer-events:none; transition:opacity .18s ease; display:flex; align-items:center; justify-content:center; }
.viewtrans.show{ opacity:1; pointer-events:auto; }
.cta-final::before{ content:""; position:absolute; inset:0; background:radial-gradient(560px 300px at 50% -10%, rgba(201,240,75,.18), transparent 60%); pointer-events:none; }
.cta-final h2{ font-size:clamp(24px,4.6vw,40px); position:relative; }
.cta-final p{ color:rgba(245,244,239,.66); margin-top:12px; font-size:14.5px; position:relative; }
.cta-final .btns{ justify-content:center; margin-top:28px; position:relative; }
.cta-final .meta{ margin-top:22px; font-size:12px; color:rgba(245,244,239,.45); display:flex; gap:18px; justify-content:center; flex-wrap:wrap; }
.foot{ background:var(--ink); color:var(--on-ink); padding:clamp(40px,6vw,64px) 0 0; margin-top:clamp(40px,6vw,72px); }
.foot-in{ display:grid; grid-template-columns:1.6fr 1fr 1fr 1.3fr; gap:30px; padding-bottom:40px; }
.foot h4{ font-size:14px; margin-bottom:14px; color:rgba(245,244,239,.45); font-weight:700; letter-spacing:.06em; }
.foot a{ display:block; padding:4px 0; font-size:13.5px; color:rgba(245,244,239,.75); transition:color .15s ease; }
.foot a:hover{ color:var(--accent); }
.foot-brand .logo{ font-size:24px; }
.foot-brand p{ font-size:13px; color:rgba(245,244,239,.55); margin-top:12px; line-height:1.75; max-width:26em; }
.foot-news{ display:flex; gap:8px; margin-top:16px; }
.foot-news .input{ border-color:var(--line-dark-2); background:transparent; color:var(--on-ink); }
.foot-news .input::placeholder{ color:rgba(245,244,239,.4); }
.foot-bottom{ border-top:1px solid var(--line-dark); padding:18px 0; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:12px; color:rgba(245,244,239,.45); }
.foot-bottom > span{ flex:none; white-space:nowrap; }
.foot-bottom a{ display:inline-block; padding:2px 4px; }
/* ============================================================
   视图通用 / 页面过渡
   ============================================================ */
.page{ padding-top:var(--hdr-h); min-height:100vh; }
.view{ animation:viewin .4s cubic-bezier(.2,.8,.3,1) both; }
@keyframes viewin{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:none;} }
.mobile-only{ display:none; }
.desk-only{ display:block; }
.crumb{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--t3); margin-bottom:14px; flex-wrap:wrap; }
.crumb a:hover{ color:var(--ink); }
.crumb b{ font-weight:600; color:var(--t2); }
.crumb .sep{ opacity:.5; }

/* 滚动出现 */
.rev{ opacity:0; transform:translateY(18px); transition:opacity .6s cubic-bezier(.2,.8,.3,1),transform .6s cubic-bezier(.2,.8,.3,1); }
.rev.in{ opacity:1; transform:none; }
.rev.d1{ transition-delay:.05s; } .rev.d2{ transition-delay:.12s; } .rev.d3{ transition-delay:.2s; }

/* ============================================================
   课程详情 · 试听播放器（Mock）
   ============================================================ */
.dstage{ background:var(--ink); padding:calc(var(--hdr-h) + clamp(20px,3vw,36px)) 0 clamp(28px,4vw,44px); }
.player{ position:relative; width:min(920px,100% - clamp(24px,6vw,64px)); margin-inline:auto; aspect-ratio:16/9;
  background:var(--ink-2); border-radius:var(--r-l); overflow:hidden; border:1px solid var(--line-dark); user-select:none; }
.player .p-bg{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.player .p-glyph{ font-family:var(--f-serif); font-style:italic; font-size:clamp(52px,9vw,110px); color:rgba(245,244,239,.1); }
.player .p-bg .p-eq{ position:absolute; bottom:0; left:0; right:0; height:56%; display:flex; gap:5px; align-items:flex-end; justify-content:center; opacity:0; }
.player.playing .p-eq{ opacity:.9; }
.p-eq i{ width:5px; height:14%; border-radius:2px; background:var(--accent); animation:eq 1s ease-in-out infinite; }
.p-eq i:nth-child(2n){ animation-delay:-.5s; } .p-eq i:nth-child(3n){ animation-delay:-.25s; }
@keyframes eq{ 0%,100%{ height:12%;} 50%{ height:88%;} }
.p-play{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; z-index:4; background:rgba(17,17,16,.35); transition:opacity .2s ease; }
.p-play.hide{ opacity:0; pointer-events:none; }
.p-play .pp{ width:66px; height:66px; border-radius:50%; background:var(--accent); color:var(--ink); display:flex; align-items:center; justify-content:center; box-shadow:0 14px 34px -8px rgba(0,0,0,.55); transition:transform .18s ease; }
.p-play .pp:hover{ transform:scale(1.07); }
.p-play .pp svg{ width:22px; height:22px; margin-left:3px; }
.p-play small{ color:var(--on-ink); font-size:12px; letter-spacing:.14em; }
.p-tag{ position:absolute; top:14px; left:14px; z-index:4; }
.p-tag.r{ left:auto; right:14px; }
.p-tag b{ display:inline-flex; align-items:center; gap:6px; background:rgba(17,17,16,.62); color:var(--on-ink); border:1px solid var(--line-dark-2); font-size:12px; font-weight:700; padding:6px 11px; border-radius:999px; }
.p-tag b i{ width:6px; height:6px; border-radius:50%; background:var(--accent); }
.p-banner{ position:absolute; left:0; right:0; bottom:0; z-index:3; padding:34px 16px 14px; background:linear-gradient(transparent, rgba(17,17,16,.82)); color:var(--on-ink); }
.p-banner .pt{ font-size:13px; color:var(--accent); font-weight:700; letter-spacing:.06em; }
.p-banner .pd{ font-size:clamp(15px,2.2vw,19px); font-weight:700; margin-top:4px; }
.p-banner .pprl{ font-size:11.5px; color:rgba(245,244,239,.6); margin-top:6px; display:flex; gap:14px; }
.p-controls{ position:absolute; left:0; right:0; bottom:0; z-index:5; display:flex; align-items:center; gap:12px; padding:10px 14px; opacity:0; transition:opacity .2s ease;
  background:linear-gradient(180deg, rgba(17,17,16,.16), rgba(17,17,16,.42));
  -webkit-backdrop-filter:blur(18px) saturate(150%); backdrop-filter:blur(18px) saturate(150%);
  border-top:1px solid rgba(255,255,255,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14); }
.player.playing .p-controls, .player:hover .p-controls{ opacity:1; }
.pc-btn{ color:var(--on-ink); width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; flex:none; }
.pc-btn:hover{ background:rgba(245,244,239,.14); }
.pc-btn svg{ width:17px; height:17px; }
.p-time{ font-size:11.5px; color:rgba(245,244,239,.75); font-variant-numeric:tabular-nums; white-space:nowrap; }
.p-seek{ position:relative; flex:1; height:22px; display:flex; align-items:center; cursor:pointer; }
.p-seek .track{ width:100%; height:3px; border-radius:99px; background:rgba(245,244,239,.25); overflow:hidden; }
.p-seek .fill{ height:100%; width:0%; background:var(--accent); border-radius:99px; }
.p-seek .knob{ position:absolute; left:0; top:50%; width:11px; height:11px; border-radius:50%; background:var(--accent); transform:translate(-50%,-50%) scale(0); transition:transform .15s ease; }
.player:hover .p-seek .knob{ transform:translate(-50%,-50%) scale(1); }
.p-sub{ position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); z-index:2; padding:0 24px; text-align:center; }
.p-sub p{ font-size:clamp(14px,2.4vw,19px); color:var(--on-ink); font-weight:600; line-height:1.7; opacity:0; transition:opacity .3s ease; margin:6px 0; }
.p-sub p.on{ opacity:1; }
.p-sub p.off{ opacity:.3; }
.player.playing .p-banner{ opacity:0; pointer-events:none; }

/* ============================================================
   课程详情内容区
   ============================================================ */
.detail-wrap{ display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:clamp(24px,4vw,48px); align-items:start; padding:clamp(24px,3.5vw,40px) 0; }
.dsec{ margin-top:clamp(26px,4vw,44px); }
.dsec-head{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
.dsec-head .no{ font-family:var(--f-serif); font-style:italic; font-size:13px; color:var(--t3); letter-spacing:.12em; }
.dsec-head h3{ font-size:clamp(19px,2.6vw,24px); }
.dtitle h1{ font-size:clamp(22px,3.6vw,34px); letter-spacing:-.015em; }
.dtitle .slogan{ display:inline-block; margin-top:12px; font-size:13.5px; font-weight:600; color:var(--ink); background:var(--accent-soft); border:1px solid rgba(201,240,75,.6); padding:7px 12px; border-radius:6px; }
.dmeta{ display:flex; flex-wrap:wrap; gap:10px 14px; margin-top:16px; align-items:center; color:var(--t2); font-size:13px; }
.dmeta .m{ display:inline-flex; align-items:center; gap:6px; flex:none; white-space:nowrap; }
.dmeta .m svg{ width:15px; height:15px; }
.dmeta .m b{ color:var(--ink); font-weight:800; }
.dtags{ display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
.gain{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.gain li{ display:flex; gap:10px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:var(--r-s); padding:14px 16px; font-size:13.5px; line-height:1.6; }
.gain li::before{ content:"✓"; flex:none; width:20px; height:20px; border-radius:50%; background:var(--accent); color:var(--ink); font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; margin-top:1px; }
.perks{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr)); gap:12px; }
.perk{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-s); padding:16px; display:flex; flex-direction:column; gap:8px; }
.perk .pi{ width:34px; height:34px; border-radius:8px; background:var(--ink); color:var(--accent); display:flex; align-items:center; justify-content:center; }
.perk .pi svg{ width:17px; height:17px; }
.perk b{ font-size:13.5px; }
.perk span{ font-size:12px; color:var(--t2); line-height:1.55; }
.who{ display:flex; flex-wrap:wrap; gap:10px; }
.who .chip{ height:auto; padding:10px 16px; border-radius:10px; }
.who .chip b{ display:block; color:var(--ink); font-size:14px; }
.who .chip span{ font-weight:500; color:var(--t3); font-size:12.5px; }
/* 大纲 */
.outline{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
.ol-sec{ border-top:1px solid var(--line); }
.ol-sec:first-child{ border-top:none; }
.ol-q{ width:100%; display:flex; align-items:center; gap:14px; padding:16px 18px; text-align:left; transition:background .16s ease; }
.ol-q:hover{ background:var(--paper-2); }
.ol-q .olno{ font-family:var(--f-serif); font-style:italic; font-size:13px; color:var(--t3); width:30px; flex:none; }
.ol-q b{ font-size:14.5px; flex:1; }
.ol-q .olmeta{ font-size:12px; color:var(--t3); display:flex; gap:10px; flex:none; }
.ol-q .fx{ width:18px; height:18px; flex:none; position:relative; }
.ol-q .fx::before,.ol-q .fx::after{ content:""; position:absolute; left:50%; top:50%; width:11px; height:1.6px; background:var(--t2); transform:translate(-50%,-50%); }
.ol-q .fx::after{ transform:translate(-50%,-50%) rotate(90deg); transition:transform .2s ease; }
.ol-sec.open .ol-q .fx::after{ transform:translate(-50%,-50%) rotate(0deg); }
.ol-lessons{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .28s cubic-bezier(.2,.8,.3,1); }
.ol-sec.open .ol-lessons{ grid-template-rows:1fr; }
.ol-lessons > div{ overflow:hidden; }
.ol-lessons ul{ background:var(--paper-2); padding:6px 18px 12px; }
.ol-lessons li{ display:flex; align-items:center; gap:12px; padding:9px 10px; border-radius:var(--r-s); font-size:13.5px; transition:background .15s ease; }
.ol-lessons li:hover{ background:var(--card); }
.ol-lessons li.is-free{ cursor:pointer; }
.ol-lessons li .lico{ width:24px; height:24px; flex:none; border-radius:50%; border:1px solid var(--line-2); display:flex; align-items:center; justify-content:center; color:var(--t2); }
.ol-lessons li.is-free .lico{ border-color:var(--ink); color:var(--ink); }
.ol-lessons li.is-play .lico{ background:var(--accent); border-color:var(--accent); color:var(--ink); }
.ol-lessons li .lico svg{ width:11px; height:11px; }
.ol-lessons li .lt{ flex:1; min-width:0; }
.ol-lessons li .lt b{ display:block; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ol-lessons li .lt small{ color:var(--t3); font-size:11.5px; }
.ol-lessons li .lfree{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; color:var(--ok); flex:none; white-space:nowrap; }
.ol-lessons li .lfree svg{ width:11px; height:11px; }
.ol-lessons li .lfree.lock{ color:var(--t3); }
/* 购买卡（桌面侧栏） */
.buycard{ position:sticky; top:calc(var(--hdr-h) + 20px);
  background:linear-gradient(150deg, rgba(255,255,255,.66), rgba(255,255,255,.28));
  -webkit-backdrop-filter:blur(22px) saturate(160%); backdrop-filter:blur(22px) saturate(160%);
  border:1px solid rgba(255,255,255,.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8), inset 0 -1px 0 rgba(255,255,255,.14), var(--sh-md);
  border-radius:var(--r-l); padding:22px; }
.buycard .bprice{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }

  border:1px solid rgba(255,255,255,.6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85), 0 12px 32px -12px rgba(17,17,16,.32);

/* 搜索 */
.searchov{ position:fixed; inset:0; z-index:180; display:flex; flex-direction:column; opacity:0; pointer-events:none; transition:opacity .25s ease;
  background:linear-gradient(160deg, rgba(250,249,246,.66), rgba(240,238,231,.40));
  -webkit-backdrop-filter:blur(28px) saturate(170%); backdrop-filter:blur(28px) saturate(170%); }
.searchov.show{ opacity:1; pointer-events:auto; }
.sov-head{ display:flex; align-items:center; gap:12px; padding:14px max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left)); border-bottom:1px solid var(--line); }
.sov-head .input{ height:46px; border:none; background:var(--paper-2); font-size:15px; }
.sov-body{ overflow:auto; padding:18px max(16px,calc((100% - 900px)/2)); width:100%; }
.sov-hot h4{ font-size:12.5px; color:var(--t3); margin-bottom:10px; letter-spacing:.08em; }
.sov-results h4{ font-size:12.5px; color:var(--t3); margin:20px 0 12px; letter-spacing:.08em; }
.sov-results .clist{ grid-template-columns:1fr 1fr; }
@media (max-width:620px){ .sov-results .clist{ grid-template-columns:1fr; } }

/* ============================================================
   Debug Panel（隐藏调试面板）
   ============================================================ */
.dbg-handle{ position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:120;
  width:42px; height:42px; display:flex; align-items:center; justify-content:center;
  border-radius:50%; background:var(--ink); color:var(--accent);
  border:1px solid rgba(201,240,75,.45);
  box-shadow:0 10px 26px -10px rgba(17,17,16,.45), inset 0 1px 0 rgba(255,255,255,.14);
  font-size:13px; cursor:pointer; transition:all .2s ease;
  animation:dbgpulse 3.4s ease-in-out infinite; }
@media (max-width:900px){ .dbg-handle{ bottom:calc(88px + env(safe-area-inset-bottom)); } }
.dbg-handle.hot{ animation:none; background:var(--accent); color:var(--ink); border-color:var(--accent); }
@keyframes dbgpulse{ 0%,100%{ box-shadow:0 10px 26px -10px rgba(17,17,16,.45), inset 0 1px 0 rgba(255,255,255,.14); }
  50%{ box-shadow:0 10px 34px -8px rgba(201,240,75,.55), inset 0 1px 0 rgba(255,255,255,.14); } }
.dbg{ position:fixed; right:0; top:0; bottom:0; width:min(340px,92vw); z-index:210; background:var(--ink); color:var(--on-ink);
  transform:translateX(102%); transition:transform .3s cubic-bezier(.2,.8,.3,1); display:flex; flex-direction:column; font-size:12.5px; box-shadow:-12px 0 40px rgba(0,0,0,.3); }
.dbg.show{ transform:none; }
.dbg-head{ display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--line-dark); }
.dbg-head b{ font-size:14px; }
.dbg-head .chip-mini{ font-size:10px; background:var(--accent); color:var(--ink); font-weight:800; padding:2px 8px; border-radius:3px; }
.dbg-close{ margin-left:auto; color:rgba(245,244,239,.8); font-size:16px; width:30px; height:30px; }
.dbg-body{ overflow:auto; padding:14px 18px 20px; display:flex; flex-direction:column; gap:18px; }
.dbg h5{ font-size:10.5px; letter-spacing:.18em; color:rgba(245,244,239,.4); margin-bottom:10px; text-transform:uppercase; }
.dbg-seg{ display:flex; flex-wrap:wrap; gap:6px; }
.dbg-seg button{ border:1px solid var(--line-dark-2); color:rgba(245,244,239,.75); padding:7px 12px; border-radius:999px; font-size:12px; transition:all .15s ease; }
.dbg-seg button:hover{ border-color:var(--on-ink); }
.dbg-seg button.is-on{ background:var(--accent); color:var(--ink); border-color:var(--accent); font-weight:700; }
.dbg-actions{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.dbg-actions button{ border:1px solid var(--line-dark-2); padding:9px 8px; border-radius:var(--r-s); font-size:12px; color:rgba(245,244,239,.8); }
.dbg-actions button:hover{ border-color:var(--accent); color:var(--accent); }
.dbg-log{ background:rgba(245,244,239,.06); border:1px solid var(--line-dark); border-radius:var(--r-s); padding:10px; font-size:11px; line-height:1.8; font-family:ui-monospace,Consolas,monospace; max-height:180px; overflow:auto; color:rgba(245,244,239,.7); }
.dbg-log b{ color:var(--accent); font-weight:600; }
.dbg-view{ font-family:ui-monospace,Consolas,monospace; color:var(--accent); }

/* ============================================================
   响应式
   ============================================================ */
@media (max-width:1080px){
  .detail-wrap{ grid-template-columns:minmax(0,1fr) 300px; }
}
@media (max-width:900px){
  .hero-in{ grid-template-columns:1fr; }
  .hero-art{ display:none; }
  .tfeat{ grid-template-columns:1fr; }
  .tp{ min-height:220px; }
  .foot-in{ grid-template-columns:1fr 1fr; }
  .foot-brand{ grid-column:1 / -1; }
  .detail-wrap{ grid-template-columns:1fr; }
  .daside{ display:none; }
  .gain{ grid-template-columns:1fr; }
  .cmp-row{ grid-template-columns:1fr; }
  .cmp-row > div{ padding:10px 16px; }
  .cmp-row.head > div:not(:first-child), .cmp-row > div:not(:first-child){ display:none; }
  .page-narrow{ }
}
@media (max-width:640px){
  .metric-grid{ grid-template-columns:1fr 1fr; }
  .val-grid{ grid-template-columns:1fr 1fr; }
  .hero-stats{ grid-template-columns:1fr 1fr; }
  .rating-sum{ grid-template-columns:1fr; gap:18px; }
  .cat-grid{ grid-template-columns:1fr 1fr; }
  .order-submit{ flex-wrap:wrap; }
  .order-submit .btn{ width:100%; margin:0; }
  .cdivider-row{ display:none; }
  /* 排行榜行：小屏拆两行，标题独占整行不再被挤压成竖排 */
  .trow{ grid-template-columns:auto minmax(0,1fr); }
  .trow > :last-child{ grid-column:1 / -1; grid-row:2; justify-self:end; }
  .tfeat .tdata{ grid-template-columns:1fr 1fr 1fr; }
}
@media (min-width:901px){
  .desktop-context{ display:block; }
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  .marq-track, .p-eq i, .pay-mask::after, .dbg-handle{ animation:none !important; }
  .rev{ opacity:1; transform:none; }
}
/* 深色模式（颜色令牌已由 light-dark() 接管，以下为专用组件的暗色细节） */
@media (prefers-color-scheme: dark){
  body{ background:var(--paper); }
  .stkbar{ background:linear-gradient(180deg, rgba(34,34,40,.86), rgba(18,18,22,.72)); border-top-color:rgba(255,255,255,.16); }
  .stkbar .sb-price b, .stkbar .sb-price b::before{ color:var(--accent); }
  .stkbar .sb-price small{ color:rgba(245,244,239,.62); }
  .stkbar .sb-price .was{ color:rgba(245,244,239,.4); }
  .toast{ background:linear-gradient(135deg, rgba(40,40,46,.94), rgba(22,22,26,.86)); color:var(--on-ink); border-color:rgba(255,255,255,.14); }
  .buycard{ background:linear-gradient(150deg, rgba(34,34,40,.94), rgba(18,18,22,.86)); }
  .buycard .bstrip .track{ background:rgba(245,244,239,.16); }
  .searchov{ background:linear-gradient(160deg, rgba(24,24,28,.96), rgba(15,15,18,.92)); }
  .sov-head{ border-color:rgba(245,244,239,.1); }
  .sov-head .input, .ct-search .input, .coupon-in .input{ background:var(--paper-2); color:var(--t1); }
  .ptag{ background:transparent; }
  .promo-bar b{ color:var(--accent); }
  .phone-screen{ background:var(--paper); }
  .phone-cover{ background:#101013; }
  .ol-lessons ul{ background:var(--paper-2); }
  .courses-tools{ background:rgba(22,22,26,.88); }
}
/* 打印（含课程大纲详版） */
@media print{
  .hdr,.stkbar,.dbg-handle,.dbg,.toast-wrap,#searchov,#modalScrim,.marq,.hero-art,.cta-final .btns,.icon-btn,#btnCta,
  .p-controls,.p-play,.p-tag,.p-banner,.p-sub,.resume-chip,.daside,.promo-bar,.hint-bar,.fav,.phone-chip,.share-row{ display:none !important; }
  body{ background:#fff; }
  .hero{ padding:14px 0; background:#fff !important; }
  .hero .k,.hero .lead,.hero .hero-stat .l{ color:#555 !important; }
  .hero h1,.hero .hero-stat .n{ color:#111 !important; }
  .page,.page-narrow{ padding:0 !important; }
  .dstage{ background:#fff !important; padding:0 0 8px; }
  .player{ border:none; background:transparent; aspect-ratio:auto; min-height:0; }
  .detail-wrap{ grid-template-columns:1fr; }
  .ol-lessons,.faq-a{ grid-template-rows:1fr !important; }
  .ol-lessons ul{ background:none; padding-left:0; }
  .ccard,.path-step,.perk,.dsec,.cat-card,.case-card,.rev-card{ break-inside:avoid; page-break-inside:avoid; }
  .rev{ opacity:1 !important; transform:none !important; }
}
/* 液态玻璃：不支持 backdrop-filter 的浏览器降级为实底，保证内容可读 */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .hdr{ background:rgba(17,17,16,.97); box-shadow:none; }
  .stkbar{ background:var(--paper); color:var(--ink); border-top-color:var(--line); box-shadow:none; }
  .stkbar .sb-price b, .stkbar .sb-price b::before{ color:var(--ink); }
  .toast{ background:var(--ink); color:var(--on-ink); }
  .buycard{ background:var(--card); box-shadow:var(--sh-md); }
  .searchov{ background:var(--paper); }
  .drawer{ background:var(--ink); box-shadow:none; }
  .p-controls{ background:rgba(17,17,16,.92); }
}
</style>

const toast = (msg,type="info",ms=2400)=>{
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  const ic = type==="ok" ? SVG.check : type==="err" ? SVG.x : SVG.check;
  el.innerHTML = `<span class="ti">${ic}</span><span>${esc(msg)}</span>`;
  $("#toastWrap").appendChild(el);
  setTimeout(()=>{ el.classList.add("out"); setTimeout(()=>el.remove(),260); }, ms);
};

const modal = (html, opts={})=>{
  const scrim = $("#modalScrim");
  $("#modalBox").innerHTML = html;
  scrim.classList.add("show");
  document.body.style.overflow = "hidden";
  // 焦点圈定 + 关闭后还原
  const prevFocus = document.activeElement;
  const focusables = ()=>[...$("#modalBox").querySelectorAll('a[href],button,input,select,textarea,[tabindex]:not([tabindex="-1"])')]
    .filter(el=>!el.disabled && el.getClientRects().length);
  const trap = e=>{
    if(e.key!=="Tab") return;
    const f = focusables(); if(!f.length) return;
    const firstEl=f[0], lastEl=f[f.length-1];
    if(e.shiftKey && document.activeElement===firstEl){ e.preventDefault(); lastEl.focus(); }
    else if(!e.shiftKey && document.activeElement===lastEl){ e.preventDefault(); firstEl.focus(); }
  };
  document.addEventListener("keydown",trap);
  setTimeout(()=>{ const f=focusables()[0] || $("#modalBox").querySelector("[data-close]") || $("#modalBox"); f.focus(); },30);
  const close = ()=>{
    scrim.classList.remove("show"); document.body.style.overflow="";
    document.removeEventListener("keydown",trap);
    if(prevFocus && prevFocus.focus) prevFocus.focus();
  };
  $("#modalBox").querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",close));
  scrim.addEventListener("click",e=>{ if(e.target===scrim && opts.closable!==false) close(); });
  return {close, el:$("#modalBox")};
};

   ============================================================ */
function couponOff(c){
  const cp = State.coupons.find(x=>x.code===State.couponCode);
  return cp ? Number(cp.off)||0 : 0;
}
function priceInfo(c){
  let now = c.price, was = c.originalPrice, mode = "none", tag = "";
  if(State.promo==="flash"){ now = Math.round(c.price*0.82/10)*10; mode="flash"; tag="限时特惠"; if(now>=was){ now=Math.max(1,Math.round(was*0.82/10)*10);} }
  else if(State.promo==="group"){ now = Math.round(c.price*0.78/10)*10; mode="group"; tag="2 人拼团价"; }
  let extra = 0, extraLabel="";
  if(State.couponCode && couponOff(c)>0){ extra = couponOff(c); now = Math.max(0, now-extra); extraLabel=`优惠券 -¥${extra}`; }
  const save = Math.max(0, was-now);
  return {now, was, mode, tag, extra, extraLabel, save};
}

function starsHtml(r){
  let html="";
  for(let i=0;i<5;i++){
    if(r>=i+1) html += `<span class="star">${SVG.star}</span>`;
    else if(r>=i+0.5) html += `<span class="star star-h">${SVG.starE}<span class="ov">${SVG.star}</span></span>`;
    else html += `<span class="star star-e">${SVG.starE}</span>`;
  }
  return `<span class="stars" aria-label="${r} 分">${html}<small>${r}</small></span>`;
}

function mount(sel, html){
  const el = $(sel);
  el.classList.remove("view");
  el.innerHTML = html;
  void el.offsetWidth;
  el.classList.add("view");
  bindFavBtn();           // 卡片内收藏（委托渲染完成后）
  bindChips();
}
function revealAll(){
  const items = $$(".rev");
  if(!("IntersectionObserver" in window)){ items.forEach(i=>i.classList.add("in")); return; }
  const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target);} }),{threshold:.12, rootMargin:"0px 0px -6% 0px"});
  items.forEach(i=>io.observe(i));
  requestAnimationFrame(()=>{ $$(".hero .rev").forEach(i=>i.classList.add("in")); });
}
function countUpAll(){
  $$("[data-count]").forEach(el=>{
    const target = parseFloat(el.dataset.count), dec = parseInt(el.dataset.dec||"0");
    const fmt = el.dataset.format==="1" ? n=>n.toLocaleString("zh-CN")
      : dec>0 ? n=>n.toFixed(dec) : n=>String(Math.round(n));
    const suf = el.dataset.suffix || "";
    const dur = 1100, t0 = performance.now();
    const step = t=>{
      const p = Math.min(1,(t-t0)/dur), ease = 1-Math.pow(1-p,3);
      el.textContent = fmt(target*ease) + suf;
      if(p<1) requestAnimationFrame(step); else el.textContent = fmt(target) + suf;
    };
    requestAnimationFrame(step);
  });
}

  // 由全局委托处理，无需单独绑定

}
function ratingStats(){
  const n = REVIEWS.length || 1;
  const mean = REVIEWS.reduce((s,r)=>s+r.stars,0) / n;
  const rows = [
    {title:"好评 · 4.5–5.0", hot:true,  count:REVIEWS.filter(r=>r.stars>=4.5).length},
    {title:"比较满意 · 4.0–4.4", hot:false, count:REVIEWS.filter(r=>r.stars>=4 && r.stars<4.5).length},
    {title:"一般 · 3.0–3.9", hot:false, count:REVIEWS.filter(r=>r.stars>=3 && r.stars<4).length},
    {title:"待改善 · 3 星以下", hot:false, count:REVIEWS.filter(r=>r.stars<3).length},
  ].map(r=>({...r, pct: Math.round(r.count/n*100)}));
  const max = Math.max(1, ...rows.map(r=>r.pct));
  return {n, mean, rows, max};
}
function ratingSumHtml(){
  const st = ratingStats();
  const mv = st.mean.toFixed(1);       // 统一一位小数，避免长分数残留
  return `<div class="big">
    <b>${mv}</b><br>
    <span class="stars">${starsHtml(+mv).replace(`<small>${mv}</small>`,"")}</span>
    <p>99+ 条评价 · 演示</p></div>
  <div class="rating-bars">
    ${st.rows.map(r=>`<div class="rbar${r.hot?" hot":""}" title="${esc(r.title)}"><span class="pct">${r.pct}%</span><div class="track"><div class="fill${r.hot?" hot":""}" style="width:${Math.round(r.pct/st.max*100)}%"></div></div><b>${r.count} 条</b></div>`).join("")}
  </div>`;
}
function renderReviews(f="all"){
  let list = REVIEWS;
  if(f==="5") list = list.filter(r=>r.stars===5);

/* Banner 手机预览轮播（5.2s 自动 · 箭头 · 指示点 · 拖动 · 悬停暂停 · 数据随 slide） */
window.__phoneTimer = null;
window.stopPhoneAuto = ()=>{ if(window.__phoneTimer){ clearInterval(window.__phoneTimer); window.__phoneTimer=null; } };
function syncPhoneChips(idx){
  const s = SLIDES[idx]; if(!s) return;
  const a = $("#phoneChipA"), b = $("#phoneChipB");
  const pop = el=>{ el.classList.remove("swap"); void el.offsetWidth; el.classList.add("swap");
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.remove("swap"))); };
  if(a){ pop(a); a.innerHTML = `<small>${s.chip[0]}</small>${s.chip[1]}`; }
  if(b){ pop(b); b.innerHTML = `<small>${CAT(s.cat).name}干货合集</small>${s.chip2}`; }
}
function initPhoneCarousel(){
  const trackEl = $("#phoneTrack"), dotsBox = $("#phoneDots");
  if(!trackEl || !dotsBox || !trackEl.children.length) return;
  const cards = [...trackEl.children], total = cards.length;
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let idx = (parseInt(window.__heroIdx)||0) % total, sx = null, downT = 0, moving = false;
  dotsBox.innerHTML = cards.map((_,i)=>`<button class="phone-dot${i===0?" on":""}" data-i="${i}" aria-label="查看第 ${i+1} 个课程" aria-current="${i===0}"></button>`).join("");
  const sync = ()=>{
    trackEl.style.transform = `translateX(-${idx*100}%)`;
    $$(".phone-dot", dotsBox).forEach((d,i)=>{ d.classList.toggle("on", i===idx); d.setAttribute("aria-current", i===idx ? "true":"false"); });
    syncPhoneChips(idx);
  };
  const go = i=>{ idx = ((i%total)+total)%total; window.__heroIdx = idx; sync(); };
  const pause = ()=>window.stopPhoneAuto();
  const play = ()=>{ window.stopPhoneAuto(); if(reduced) return; window.__phoneTimer = setInterval(()=>go(idx+1), 5200); };
  dotsBox.addEventListener("click",e=>{
    const d = e.target.closest("[data-i]"); if(!d) return;
    pause(); go(+d.dataset.i); play();
    track("hero_card_swipe",{to:d.dataset.i});
  });
  const phoneEl = trackEl.closest(".phone");
  phoneEl.addEventListener("mouseenter",pause);
  phoneEl.addEventListener("mouseleave",play);
  // 指针拖动 + 轻点跳转
  const car = trackEl.parentElement;
  car.setAttribute("tabindex","0");
  car.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft"||e.key==="ArrowRight"){ e.preventDefault(); pause(); go(idx + (e.key==="ArrowRight"?1:-1)); play(); track("hero_card_key",{dir:e.key}); }
  });
  car.addEventListener("pointerdown",e=>{ sx=e.clientX; downT=Date.now(); moving=false; trackEl.style.transition="none"; });
  car.addEventListener("pointermove",e=>{
    if(sx==null) return;
    const dx = e.clientX-sx;
    if(Math.abs(dx)>6){ moving=true; trackEl.style.transform=`translateX(calc(-${idx*100}% + ${dx}px))`; }
  });
  const finish = e=>{
    if(sx==null) return;
    const dx = e.clientX - sx, quick = Date.now()-downT < 350;
    trackEl.style.transition="";
    if(moving){
      if(Math.abs(dx) > car.clientWidth*0.16){ go(idx + (dx<0?1:-1)); } else sync();
      if(Math.abs(dx) > 8) track("hero_card_swipe",{dir:dx<0?"next":"prev"});
    } else if(quick){
      const act = e.target.closest("[data-play], [data-cat]");
      if(act){ /* 由全局委托处理 CTA，不在此跳转 */ }
      else { const card = e.target.closest("[data-go]"); if(card){ e.preventDefault(); nav(card.dataset.go); } }
    }
    sx=null;
  };
  car.addEventListener("pointerup",finish);
  car.addEventListener("pointercancel",()=>{ if(sx==null) return; sx=null; trackEl.style.transition=""; sync(); });
  sync(); play();
}
